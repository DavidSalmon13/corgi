spring:
  application:
    name: plainly-api
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/plainly}
    username: ${DATABASE_USER:plainly}
    password: ${DATABASE_PASSWORD:plainly}
  flyway:
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

plainly:
  # Policy dates are America/New_York calendar days (DECISIONS.md, 2026-11-22).
  zone: America/New_York
  # Optional fixed "today" (yyyy-MM-dd) for demos and tests. Empty = the real date.
  today: ${PLAINLY_TODAY:}
  session:
    # Send the session cookie only over HTTPS. Set SESSION_COOKIE_SECURE=true on Railway.
    secure-cookie: ${SESSION_COOKIE_SECURE:false}
  demo:
    # Seed Maya Okafor's demo policy and account at startup (real-sign-in AC12). Off in tests.
    seed: ${PLAINLY_DEMO_SEED:true}
