spring:
  application:
    name: plainly-api
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/plainly}
    username: ${DATABASE_USER:plainly}
    password: ${DATABASE_PASSWORD:plainly}
  flyway:
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  # Trust X-Forwarded-* from Railway's proxy, so an HTTPS request is seen as secure (Secure session cookie).
  forward-headers-strategy: framework

plainly:
  # Policy dates are America/New_York calendar days (DECISIONS.md, 2026-11-22).
  zone: America/New_York
  # Optional fixed "today" (yyyy-MM-dd) for demos and tests. Empty = the real date.
  today: ${PLAINLY_TODAY:}
  session:
    # Always mark the session cookie Secure. It is already Secure on any HTTPS request; this forces it.
    secure-cookie: ${SESSION_COOKIE_SECURE:false}
  demo:
    # Seed Maya Okafor's demo policy and account at startup (real-sign-in AC12). Off in tests.
    seed: ${PLAINLY_DEMO_SEED:true}
  refunds:
    # Resend refunds that were never confirmed by Stripe (correct-effective-date review fix). Off in tests.
    sweep: ${PLAINLY_REFUND_SWEEP:true}
    sweep-after: PT2M
    sweep-every: PT1M
  stripe:
    # Test-mode keys only, from env (.env locally). Empty = payments are switched off.
    secret-key: ${STRIPE_SECRET_KEY:}
    publishable-key: ${STRIPE_PUBLISHABLE_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  email:
    # Resend sandbox, from env (.env locally). Empty key or test inbox = emails are switched off.
    api-key: ${RESEND_API_KEY:}
    from: ${RESEND_FROM:Plainly <onboarding@resend.dev>}
    # Without a verified domain Resend only delivers to the account owner, so all demo mail goes here (DECISIONS).
    test-to: ${RESEND_TEST_TO:}
    # Send after commit on a small background pool, so a slow Resend never holds a request. Off in tests.
    send-async: true
  # Namespaces the Stripe and Resend idempotency keys, so local runs and the Railway deploy (one shared sandbox,
  # both numbering rows from 1) never send the same key. Railway sets RAILWAY_ENVIRONMENT_ID itself.
  idempotency-prefix: ${IDEMPOTENCY_PREFIX:${RAILWAY_ENVIRONMENT_ID:local}}
  # Where the web app lives, for links in emails.
  web-url: ${PLAINLY_WEB_URL:http://localhost:5173}
